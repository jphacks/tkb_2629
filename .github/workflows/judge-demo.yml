name: Judge demo

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/judge-demo.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/judge-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_DEMO_MODE: 'true'
      EXPO_NO_DOTENV: '1'
      DEMO_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/demo.test.cjs tests/account.test.cjs tests/history.test.cjs tests/bookMemo.test.cjs
      - run: npx expo export --platform web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
